name: Checks
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    name: App (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.8'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile runcom.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
        env:
          RUNCOM_REQUIRE_GUI: '1'
      - if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
        env:
          RUNCOM_REQUIRE_GUI: '1'
      - if: runner.os != 'Windows'
        run: bash -n install.sh download_assistant.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
          ./tests/test_windows_installer.ps1
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check download.js
      - run: node tests/test_download.cjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-screenshots
          path: .test-artifacts/*.png
          include-hidden-files: true
